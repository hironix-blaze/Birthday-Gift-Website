<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#CF9FFF">

    <title>One Little Question ♡</title>

    <link rel="icon" type="image/png" href="assets/images/starlit-moon.png">
    <link rel="stylesheet" href="styles/index.css">

    <script src="scripts/index.js" defer></script>
</head>
<body>
    <main class="question-page">
        <!-- Floaties :> -->
        <div class="floating-heart heart1">♡</div>
        <div class="floating-heart heart2">💜</div>
        <div class="floating-heart heart3">✧</div>
        <div class="floating-heart heart4">✦</div>
        <section class="question-content">
            <div class="question-sparkle">✨</div>
            <h1>Are you ready for a surprise?</h1>
            <p class="question-subtitle">
                I have something special waiting for you! ♡
            </p>
            <div class="question-buttons">
                <button class="yes-button" id="yesButton">
                    YES! ♡
                </button>
                <button class="no-button" id="noButton">
                    No :(
                </button>
            </div>
            <p class="question-footer">
                Choose wisely, cutie! 💗
            </p>
        </section>
    </main>
</body>
</html>
